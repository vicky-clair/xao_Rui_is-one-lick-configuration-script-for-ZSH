# ============================================
# Tmux 跨平台现代化生产力配置
# ============================================
# 兼容：Linux (X11 / Wayland)、macOS 与 WSL
# 支持：全平台剪贴板互通 (OSC 52 + 智能工具降级)、Tokyo Night 主题、Vi 键位、TPM 插件
# ============================================

# --------------------------------------------
# 1. 基础环境与终端真彩色
# --------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB:clipboard"

# 消除 Neovim / Vim 按 Esc 键时的延迟
set -sg escape-time 10

# 传递聚焦事件（Neovim 自动读取修改 autoread 依赖项）
set -g focus-events on

# 增加回滚历史缓冲区行数（默认 2000 太小）
set -g history-limit 50000

# 状态栏信息刷新间隔（秒）
set -g status-interval 3

# --------------------------------------------
# 2. 前缀键映射 (Prefix Key)
# --------------------------------------------
# 将前缀键修改为 Ctrl + a（更符合人体工学，兼顾 GNU Screen 习惯）
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# --------------------------------------------
# 3. 窗口与窗格行为
# --------------------------------------------
# 窗口与窗格起始编号设为 1（键盘数字 1~9 在左侧，0 在最右端）
set -g base-index 1
setw -g pane-base-index 1
# 关闭中间窗口后自动重新排序编号
set -g renumber-windows on

# 分割窗格：保持当前窗格工作目录 (-c "#{pane_current_path}")
# | 水平分屏（左右两栏），- 垂直分屏（上下两栏）
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# 新建窗口也默认继承当前工作目录
bind c new-window -c "#{pane_current_path}"

# 调整窗格大小（-r 标志支持 500ms 内连续快速按键，无需反复按 Prefix）
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# 切换会话默认路径为当前窗格路径
bind M-c attach-session -c "#{pane_current_path}"

# 快速重新加载配置文件并显示屏幕提示
unbind r
bind r source-file ~/.tmux.conf \; display-message "✓ ~/.tmux.conf reloaded successfully!"

# --------------------------------------------
# 4. 鼠标支持与全平台终端复制粘贴
# --------------------------------------------
# 启用鼠标（支持点击切换窗格、调整大小、滚轮滚动）
set -g mouse on

# 启用 vi 模式键位
set-window-option -g mode-keys vi

# 核心：启用 OSC 52 终端原生剪贴板通道
# 使得本地、WSL 以及远程 SSH 连接下的 Windows Terminal/iTerm2/Alacritty 等终端
# 均可无需安装任何额外工具直接将选中文本透传至系统剪贴板！
set -s set-clipboard on

# 进入复制模式快捷键：Prefix + [
# 开始选择文本：按 v
bind-key -T copy-mode-vi 'v' send -X begin-selection
# 矩形列块选择：按 Ctrl + v
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# 复制到系统剪贴板命令（智能优雅降级：支持 Wayland / X11 / macOS / WSL）
# 针对支持 OSC 52 的终端会自动写入宿主机剪贴板；同时通过多重管道回落支持各平台原生剪贴板工具
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || pbcopy 2>/dev/null || clip.exe 2>/dev/null || true"

# 鼠标拖拽选中文本：
# 选中文本后自动复制到剪贴板，但保持当前位置，不强制退出复制模式，不闪烁滚回底部！
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || pbcopy 2>/dev/null || clip.exe 2>/dev/null || true"

# 粘贴快捷键：
# 1. 终端常规快捷键：Linux/Windows Terminal 按 Ctrl+Shift+V，macOS 按 Cmd+V
# 2. Tmux 缓冲区粘贴：Prefix + ]
# 3. Tmux 内直接粘贴内部缓冲区：Prefix + p
bind-key p paste-buffer

# --------------------------------------------
# 5. 插件生态与 TPM 插件管理器
# --------------------------------------------
# 首次运行时若未发现 TPM，自动无感拉取并触发插件安装
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# TPM 基础插件
set -g @plugin 'tmux-plugins/tpm'

# 插件列表
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'cesarferreira/tmux.expose'

# 插件专属参数
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# 初始化 TPM 插件管理器（必须保持在文件最末行）
run '~/.tmux/plugins/tpm/tpm'
