# ============================================
# Tmux 跨平台现代化生产力配置
# ============================================
# 兼容：Linux (X11 / Wayland)、macOS 与 WSL
# 支持：全平台剪贴板互通 (OSC 52 + 智能工具降级)、Tokyo Night 主题、Vi 键位、TPM 插件
# ============================================

# --------------------------------------------
# 1. 基础环境与终端真彩色 & 剪贴板通配
# --------------------------------------------
# 智能终端类型适配：系统支持 tmux-256color 则优先使用；若为精简系统缺失该 terminfo，
# 自动优雅降级为几乎全平台标配的 screen-256color，彻底杜绝 "missing or unsuitable terminal" 崩溃！
if-shell "infocmp tmux-256color >/dev/null 2>&1" \
    "set -g default-terminal 'tmux-256color'" \
    "set -g default-terminal 'screen-256color'"

# 重载配置时先重置系统终端扩展，防止 Prefix + r 反复累积重复项
set -su terminal-overrides
set -su terminal-features

# 开启所有终端类型的 RGB 24 位真彩色支持（避免颜色断层）
set -as terminal-overrides ",*:RGB"
# 为兼容更多终端模拟器（Windows Terminal/iTerm2/Alacritty/PuTTY 等），注入标准 Ms 转义序列
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'
# 全局通配声明剪贴板特性，启用 OSC 52 剪贴板通道
set -as terminal-features ",*:RGB:clipboard"

# --------------------------------------------
# 会话常驻与防误关 (Session Persistence)
# --------------------------------------------
# 客户端断开连接时不销毁会话；无活动客户端时不退出服务进程；关闭窗格时不退出客户端
# 确保终端直接关闭时后台进程完好保留，重新连接即可无缝恢复现场！
set -g destroy-unattached off
set -g exit-empty off
set -g detach-on-destroy off

# 消除 Neovim / Vim 按 Esc 键时的延迟（单位毫秒，设为 10ms）
set -sg escape-time 10

# 传递窗口聚焦事件（供 Neovim autoread 自动重载外部修改文件使用）
set -g focus-events on

# 增加回滚历史缓冲区行数（默认 2000 行过短，设为 50000 行便于查看长日志）
set -g history-limit 50000

# 状态栏信息刷新间隔（秒），设为 5 秒平滑刷新，大幅降低弱网 SSH 与低算力机器的重绘开销与顿挫感
set -g status-interval 5
# 确保状态栏常驻底部，贴合终端使用习惯
set -g status-position bottom

# --------------------------------------------
# 2. 前缀键映射 (Prefix Key)
# --------------------------------------------
# 将前缀键修改为 Ctrl + a（更符合人体工学，兼顾 GNU Screen 习惯）
# 注：若在命令行需发送跳到行首的 Ctrl+A，请连按两次 Ctrl+A 即可
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# --------------------------------------------
# 3. 窗口与窗格行为
# --------------------------------------------
# 窗口与窗格起始编号设为 1（键盘数字 1~9 在左侧，0 在最右端更顺手）
set -g base-index 1
setw -g pane-base-index 1
# 关闭中间窗口后自动重新排序编号，避免序号断号
set -g renumber-windows on

# 分割窗格：保持当前窗格工作目录 (-c "#{pane_current_path}")
# | 水平分屏（左右两栏），- 垂直分屏（上下两栏）
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# 新建窗口也默认继承当前窗格所在目录
bind c new-window -c "#{pane_current_path}"

# 调整窗格大小（-r 标志支持 500ms 内连续快速按键，无需反复按 Prefix）
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# 切换当前会话默认路径为当前窗格所在路径
bind M-c attach-session -c "#{pane_current_path}"

# 快速唤出 Lazygit（需系统已安装 lazygit）
# Prefix + g 居中悬浮窗弹出（支持 Tmux >= 3.2），按 q 或 Esc 退出返回原窗格
bind-key g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
# Prefix + G 在新窗口中全屏打开并继承当前目录
bind-key G new-window -c "#{pane_current_path}" lazygit

# 快速重新加载配置文件并显示屏幕提示（Prefix + r）
unbind r
bind r source-file ~/.tmux.conf \; display-message "✓ ~/.tmux.conf reloaded successfully!"

# --------------------------------------------
# 4. 鼠标支持与全平台终端复制粘贴
# --------------------------------------------
# 启用鼠标（支持点击切换窗格、拖拽调整大小、滚轮滚动查看历史）
set -g mouse on

# 启用 vi 模式键位（在复制/翻屏模式下使用 h/j/k/l 移动）
set-window-option -g mode-keys vi

# 核心：启用 OSC 52 终端原生剪贴板通道
# 使得本地、WSL 以及远程 SSH 连接下的 Windows Terminal/iTerm2/Alacritty 等终端
# 均可无需安装任何额外工具直接将选中文本透传至本地宿主机剪贴板！
set -s set-clipboard on

# 进入复制模式快捷键：Prefix + [
# 开始选择文本：按 v
bind-key -T copy-mode-vi 'v' send -X begin-selection
# 矩形列块选择：按 Ctrl + v
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
# 退出复制模式：按 Esc
bind-key -T copy-mode-vi 'Escape' send -X cancel

# 键盘 'y' 复制并退出复制模式：
# 优雅降级管道：支持 Wayland (wl-copy) / X11 (xclip) / macOS (pbcopy) / WSL (clip.exe)
# 针对 xclip 增加 timeout 1s 超时防护（若支持），彻底避免 SSH X11 转发失效时连接挂起死锁
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "sh -c 'if [ -n \"\$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n \"\$DISPLAY\" ] && command -v xclip >/dev/null 2>&1; then if command -v timeout >/dev/null 2>&1; then timeout 1s xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; else xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; fi; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'"

# 鼠标拖拽选中文本：
# 选中文本松开后自动复制到剪贴板，并立即退出复制模式（copy-pipe-and-cancel）！
# 【关键修复】：彻底解决因停留在 vi 复制模式导致后续打字输入被拦截吞掉而“假死卡住”的故障！
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "sh -c 'if [ -n \"\$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n \"\$DISPLAY\" ] && command -v xclip >/dev/null 2>&1; then if command -v timeout >/dev/null 2>&1; then timeout 1s xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; else xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; fi; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'"

# 单击任意位置随时退出复制模式，确保随时恢复正常键盘打字
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel

# 双击选择词并复制后退出
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "sh -c 'if [ -n \"\$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n \"\$DISPLAY\" ] && command -v xclip >/dev/null 2>&1; then if command -v timeout >/dev/null 2>&1; then timeout 1s xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; else xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; fi; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'"

# 三击选择整行并复制后退出
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "sh -c 'if [ -n \"\$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif [ -n \"\$DISPLAY\" ] && command -v xclip >/dev/null 2>&1; then if command -v timeout >/dev/null 2>&1; then timeout 1s xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; else xclip -in -selection clipboard 2>/dev/null || cat >/dev/null; fi; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'"

# 粘贴操作指南：
# 1. 本地向远程终端粘贴：直接在终端使用系统粘贴键，如 Windows Terminal 按 Ctrl+Shift+V（或右键），macOS 按 Cmd+V
# 2. Tmux 内部缓冲区粘贴：按 Prefix + ] 或按 Prefix + p
# 3. 原生选择避坑提示：任何时候按住 Shift 键再用鼠标拖选，均可强制绕过 tmux 接管，直接使用终端原生选区复制
bind-key p paste-buffer

# --------------------------------------------
# 5. 插件生态与 TPM 插件管理器
# --------------------------------------------
# 首次运行时若未发现 TPM，异步后台无感拉取并触发插件安装（加 -b 标志异步运行，完成后自动重载生效，绝不阻塞启动终端！）
if-shell "test ! -d ~/.tmux/plugins/tpm" \
   "run -b 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm >/dev/null 2>&1 && ~/.tmux/plugins/tpm/bin/install_plugins >/dev/null 2>&1 && tmux source-file ~/.tmux.conf >/dev/null 2>&1'"

# TPM 基础插件
set -g @plugin 'tmux-plugins/tpm'

# 插件列表
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'cesarferreira/tmux.expose'

# 插件专属参数
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Tokyo Night 状态栏主题配置 (纯正 Tokyo Night 配色，跨平台稳定，无 Bash 5.2 硬性限制)
set -g @tokyo-night-tmux_theme 'night'
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_show_battery_widget 1
if-shell "test -d /sys/class/power_supply/BAT0" \
    "set -g @tokyo-night-tmux_battery_name 'BAT0'" \
    "set -g @tokyo-night-tmux_battery_name 'BAT1'"
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format YMD
set -g @tokyo-night-tmux_time_format 24H

# 初始化 TPM 插件管理器（存在时加载，避免首次自举前报 127 错误，必须保持在文件最末行）
run '[ -f ~/.tmux/plugins/tpm/tpm ] && ~/.tmux/plugins/tpm/tpm || true'
