# 在多种 Linux 容器中运行隔离回归，覆盖安装器与配置管理流程。
name: Shell regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      # 单个平台失败后仍继续其余平台，便于发现发行版兼容差异。
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      # 依赖只安装在本次任务的容器内，回归脚本中的下载与系统修改使用替身。
      - name: Install test prerequisites in disposable container
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash zsh git coreutils diffutils findutils grep sed ca-certificates util-linux bsdutils sudo curl file procps
          elif command -v dnf >/dev/null; then
            dnf install -y bash zsh git coreutils diffutils findutils grep sed ca-certificates util-linux sudo curl file procps-ng
          else
            pacman -Syu --noconfirm bash zsh git coreutils diffutils findutils grep sed ca-certificates util-linux sudo curl file procps-ng
          fi
      - uses: actions/checkout@v4
      - name: Installer regression (mocked downloads and system changes)
        shell: bash
        run: bash scripts/test_installer.sh
      - name: Configuration management regression
        shell: bash
        run: bash scripts/test_management.sh
      - name: Live installation, idempotency, and health check
        shell: bash
        run: |
          useradd -m -s /bin/bash testuser || true
          mkdir -p /etc/sudoers.d
          echo "testuser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/testuser
          chmod 0440 /etc/sudoers.d/testuser
          # 模拟生产环境标准部署目录 ~/.zsh-project
          cp -a "$GITHUB_WORKSPACE" /home/testuser/.zsh-project
          chown -R testuser:testuser /home/testuser/.zsh-project
          # 1. 首次全新安装测试（完整工具链 + 彩虹主题 + 自动化 --yes）
          su - testuser -c "cd ~/.zsh-project && bash install.sh --profile full --p10k-style rainbow --lang zh --yes"
          # 2. 第二次运行：严格验证幂等性（已有软件和依赖绝不重复安装，退出码为 0）
          su - testuser -c "cd ~/.zsh-project && bash install.sh --profile full --p10k-style rainbow --lang zh --yes"
          # 3. 运行环境体检
          su - testuser -c "cd ~/.zsh-project && bash scripts/manage.sh --doctor"
